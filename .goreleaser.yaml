# GoReleaser v2 (SPEC §14.2, §14.3): `make release-snapshot` builds into
# dist/; `make release` publishes the GitHub release and commits the cask.
version: 2

before:
  hooks:
    - ./scripts/completions.sh

builds:
  - id: basho
    main: ./cmd/basho # basho-data is never shipped
    binary: basho
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    # Only the version, as `make install` does: the tag with its "v".
    # Commit and date come from the toolchain's VCS stamping (§14).
    ldflags:
      - -s -w -X github.com/thorstenpfister/basho/internal/buildinfo.Version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # File times from the commit, so the archives are reproducible too.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mtime: "{{ .CommitDate }}"
      - src: manpages/*
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .ShortCommit }}-snapshot"

# The CHANGELOG.md is written by hand.
changelog:
  disable: true

# The GitHub release; its notes are the tag's CHANGELOG entry
# (`make release` passes them with --release-notes).
release:
  github:
    owner: thorstenpfister
    name: basho
  name_template: "{{ .Tag }}"

# The tap is this repository (D22): each release commits Casks/basho.rb to
# main. Install: brew install --cask thorstenpfister/basho/basho
homebrew_casks:
  - name: basho
    repository:
      owner: thorstenpfister
      name: basho
      branch: main
    directory: Casks
    homepage: https://github.com/thorstenpfister/basho
    description: Grand sumo tournaments in the terminal, from 1960 to today's bouts
    license: MIT
    binaries: [basho]
    manpages: [manpages/basho.1.gz]
    completions:
      bash: completions/basho.bash
      zsh: completions/basho.zsh
      fish: completions/basho.fish
    commit_msg_template: "cask: basho {{ .Tag }}"
    # Unsigned (D25): drop the quarantine flag so macOS runs it without a
    # Gatekeeper prompt, as GoReleaser documents for unsigned casks.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/basho"]
          end
